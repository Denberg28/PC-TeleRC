[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-telerc"
version = "0.1.0a7"
description = "Windows MAVLink rover bridge for PXN and compatible steering wheel controllers"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Denberg28"}]
dependencies = [
  "PySide6==6.11.2",
  "pymavlink==2.4.50",
  "pygame-ce==2.5.8",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.scripts]
pc-telerc = "pctelerc.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
