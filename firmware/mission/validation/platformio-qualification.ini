; Qualification recipe; uses generated private Config.h, never public example keys.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = telerc-lilygo-sx1262
board_build.partitions = default.csv
framework = arduino
lib_deps = https://github.com/jgromes/RadioLib/archive/refs/tags/7.2.1.zip
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
[env:base]
build_flags = ${env.build_flags} -DROLE=1
[env:rover]
build_flags = ${env.build_flags} -DROLE=2
[env:node]
build_flags = ${env.build_flags} -DROLE=3

[env:node2]
build_flags = ${env.build_flags} -DROLE=3 -DNODE_INDEX=2
