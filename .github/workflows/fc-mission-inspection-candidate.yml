name: FC Mission Inspection Candidate
on:
  push:
    branches: [dev/fc-mission-inspection-safety]
  pull_request:
    branches: [baseline/mission-planning-v1.2.0rc1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and check dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Python syntax checks
        run: python -m compileall -q src tests main.py
      - name: Application regression
        run: python -m pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean PC-TeleRC.spec
      - name: Package portable executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PC-TeleRC/PC-TeleRC.exe')) { throw 'Executable missing' }
          Copy-Item 'docs/FC-MISSION-INSPECTION-SAFETY.md' 'dist/PC-TeleRC/'
          Compress-Archive -Path 'dist/PC-TeleRC/*' -DestinationPath 'PC-TeleRC-FC-Inspection-RC-portable.zip' -Force
          (Get-FileHash 'PC-TeleRC-FC-Inspection-RC-portable.zip' -Algorithm SHA256).Hash.ToLower() | Set-Content 'SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: PC-TeleRC-FC-Inspection-RC-Windows
          path: |
            PC-TeleRC-FC-Inspection-RC-portable.zip
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
