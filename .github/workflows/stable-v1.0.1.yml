name: PC TeleRC v1.0.1 stable release
on:
  push:
    branches: [release/stable-v1.0.1]
permissions:
  contents: read
concurrency:
  group: stable-v1.0.1
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Check release and source archive boundaries
        run: python -m unittest discover -s scripts -p 'test_*safety.py' -v
      - name: Validate and build native Windows portable
        run: python scripts/build_windows_mission.py --source-commit '${{ github.sha }}'
      - name: Verify publish tooling
        run: node --test tests/test_publish_stable.cjs
      - name: Build versioned installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler 'installer\PC-TeleRC.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-dist\PC-TeleRC-Setup-v1.0.1.exe release-dist\
          Get-ChildItem release-dist -File | Where-Object Name -ne 'SHA256-windows.txt' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii release-dist\SHA256-windows.txt
      - name: Retain executable, installer and frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC-TeleRC-v1.0.1-Windows-and-evidence
          path: |
            release-dist/
            frozen-ui-check.json
            frozen-stdout.txt
            frozen-stderr.txt
            ecosystem-release.json
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: arduino/setup-arduino-cli@v2
        with: {version: '1.3.1'}
      - name: Test actual mission runtime and security invariants
        run: |
          python -m pip install -r firmware/mission/requirements.txt pytest
          python -m pytest -q firmware/mission/tests/test_tools.py firmware/mission/tests/test_mission_simulation.py
          python firmware/mission/tests/run_native.py --sanitize
          python -c "import sys;sys.path.insert(0,'scripts');from manual_companion import extract;extract('/tmp/manual-reviewed')"
          bash /tmp/manual-reviewed/TeleRC-LoRa-v1.0.1/tests/run.sh
      - name: Install pinned board dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
      - run: python scripts/build_v1_firmware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PC-TeleRC-v1.0.1-firmware-and-evidence
          path: |
            firmware-dist/
            firmware-v1-evidence/
            ecosystem-release.json

  release:
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'PC-TeleRC-v1.0.1-*'
          path: incoming
      - name: Sanitize, verify matching packages and downloaded assets, then publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_v1_release.py --incoming incoming --commit '${{ github.sha }}' --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PC-TeleRC-v1.0.1-final-assets
          path: stable-release/
