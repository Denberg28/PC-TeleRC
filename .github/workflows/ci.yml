name: Candidate v0.1.2rc2 Windows and firmware build
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify candidate version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare test candidate draft
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/lilygo-relays-v0.1.2rc2' && steps.version.outputs.version == '0.1.2rc2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2rc2
          target_commitish: ${{ github.sha }}
          name: PC TeleRC v0.1.2rc2 — Sketch pairing, screen sleep and relay nodes
          draft: true
          prerelease: true
          make_latest: false
          body_path: docs/releases/v0.1.2rc2.md
  firmware:
    needs: prepare
    if: needs.prepare.outputs.version == '0.1.2rc2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actual-sketch host fault and compatibility checks
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev
          python3 firmware/tests/run_tests.py
          python3 firmware/lora-tests/run_tests.py
          python3 firmware/lilygo-tests/run_host_tests.py
          python3 firmware/runtime-tests/run_tests.py
          python3 firmware/relay-tests/run_tests.py
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install pinned ESP32 and LoRa dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
      - name: Compile PWM converter and original Wi-Fi/ELRS bridge
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc --output-dir firmware-build/PWM firmware/TeleRC_4x_BTS7960_PWM_GlitchFilter
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc --output-dir firmware-build/WIFI firmware/TeleRCBridge
          mkdir -p firmware-build-input/TeleRCBridge_ELRS
          sed 's/#define TELERC_LINK_MODE 0/#define TELERC_LINK_MODE 1/' firmware/TeleRCBridge/TeleRCBridge.ino > firmware-build-input/TeleRCBridge_ELRS/TeleRCBridge_ELRS.ino
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc --output-dir firmware-build/ELRS firmware-build-input/TeleRCBridge_ELRS
      - name: Package candidate source, sketches, target builds and checksums
        run: |
          python3 scripts/package_candidate.py
          cp docs/LILYGO-SKETCH-RELAYS.md firmware-build/READ-ME-FIRST.md
          cp docs/LILYGO-WIFI-LORA.md firmware-build/LILYGO-WIFI-LORA.md
          cd firmware-build
          zip -r ../release-dist/TeleRC-Firmware-v0.1.2rc2-original-target-builds.zip .
          cd ../release-dist
          sha256sum *.zip > SHA256-firmware-source.txt
      - name: Attach firmware directly to candidate draft
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/lilygo-relays-v0.1.2rc2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2rc2
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: false
          files: release-dist/*
  lilygo:
    needs: prepare
    if: needs.prepare.outputs.version == '0.1.2rc2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [BASE, ROVER, NODE]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install pinned LilyGO dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
      - name: Compile and package LilyGO profiles
        run: python3 scripts/build_lilygo_targets.py ${{ matrix.group }}
      - name: Attach LilyGO target group directly to candidate draft
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/lilygo-relays-v0.1.2rc2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2rc2
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: false
          files: release-dist/*
  windows:
    needs: prepare
    if: needs.prepare.outputs.version == '0.1.2rc2'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and validate source
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q src tests main.py
      - name: Full application regression checks
        run: python -m pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean PC-TeleRC.spec
      - name: Package portable app with setup guides
        shell: pwsh
        run: |
          Copy-Item START-HERE.md dist\PC-TeleRC\START-HERE.md
          Copy-Item docs\LILYGO-SKETCH-RELAYS.md dist\PC-TeleRC\LILYGO-SKETCH-RELAYS.md
          Copy-Item docs\LILYGO-RUNTIME-SETUP.md dist\PC-TeleRC\LILYGO-RUNTIME-SETUP.md
          Copy-Item docs\LILYGO-WIFI-LORA.md dist\PC-TeleRC\LILYGO-WIFI-LORA.md
          Copy-Item docs\FIRMWARE-RECOVERY-rc7.md dist\PC-TeleRC\FIRMWARE-RECOVERY-rc7.md
          Compress-Archive -Path dist\PC-TeleRC\* -DestinationPath dist\PC-TeleRC-portable-v0.1.2rc2.zip -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC-TeleRC.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage installer, portable and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-release | Out-Null
          Copy-Item dist\PC-TeleRC-portable-v0.1.2rc2.zip windows-release\
          Copy-Item installer-dist\PC-TeleRC-Setup-v0.1.2rc2.exe windows-release\
          Get-ChildItem windows-release\* | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii windows-release\SHA256-windows.txt
      - name: Attach Windows builds directly to candidate draft
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/lilygo-relays-v0.1.2rc2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2rc2
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: false
          files: windows-release/*
  release:
    needs: [prepare, firmware, lilygo, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/lilygo-relays-v0.1.2rc2' && needs.prepare.outputs.version == '0.1.2rc2'
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete candidate assets and retain draft
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({...context.repo});
            const release = releases.data.find(r => r.tag_name === 'v0.1.2rc2');
            if (!release) throw new Error('Candidate draft release missing');
            const assets = await github.rest.repos.listReleaseAssets({...context.repo, release_id: release.id});
            const byName = new Map(assets.data.map(a => [a.name, a]));
            for (const name of ['PC-TeleRC-portable-v0.1.2rc2.zip', 'PC-TeleRC-Setup-v0.1.2rc2.exe',
                                'PC-TeleRC-source-v0.1.2rc2.zip', 'TeleRC-Firmware-v0.1.2rc2-sketches.zip',
                                'TeleRC-Firmware-v0.1.2rc2-original-target-builds.zip',
                                'TeleRC-Firmware-v0.1.2rc2-LilyGO-BASE-targets.zip',
                                'TeleRC-Firmware-v0.1.2rc2-LilyGO-ROVER-targets.zip',
                                'TeleRC-Firmware-v0.1.2rc2-LilyGO-NODE-targets.zip',
                                'SHA256-firmware-source.txt', 'SHA256-source-sketches.txt', 'SHA256-windows.txt']) {
              const asset = byName.get(name);
              if (!asset || asset.size <= 0 || asset.state !== 'uploaded') throw new Error('Missing or incomplete release asset: ' + name);
            }
            const published = await github.rest.repos.updateRelease({...context.repo,
              release_id: release.id, target_commitish: context.sha, draft: true,
              prerelease: true, make_latest: 'false'});
            core.info('Validated candidate draft v0.1.2rc2 with complete downloads: ' + published.data.html_url);

