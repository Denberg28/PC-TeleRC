name: CI and Windows build
on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Dependency integrity
        run: python -m pip check
      - name: Static syntax check
        run: python -m compileall -q src tests main.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean PC-TeleRC.spec
      - name: Create portable checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\PC-TeleRC.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PC-TeleRC.exe" | Set-Content -Encoding ascii dist\SHA256.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC-TeleRC.iss"

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer-dist\PC-TeleRC-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii installer-dist\SHA256-installer.txt

      - uses: actions/upload-artifact@v7
        with:
          name: PC-TeleRC-windows-x64-${{ github.sha }}
          path: |
            dist/PC-TeleRC.exe
            dist/SHA256.txt
            installer-dist/PC-TeleRC-Setup-*.exe
            installer-dist/SHA256-installer.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/PC-TeleRC.exe
            dist/SHA256.txt
            installer-dist/PC-TeleRC-Setup-*.exe
            installer-dist/SHA256-installer.txt

      - name: Publish first prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'release: publish v0.1.0a6')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0a6
          target_commitish: ${{ github.sha }}
          name: PC TeleRC v0.1.0a6
          prerelease: true
          body_path: docs/releases/v0.1.0a6.md
          files: |
            dist/PC-TeleRC.exe
            dist/SHA256.txt
            installer-dist/PC-TeleRC-Setup-*.exe
            installer-dist/SHA256-installer.txt
