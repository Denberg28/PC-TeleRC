name: CI and Windows build
on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Dependency integrity
        run: python -m pip check
      - name: Static syntax check
        run: python -m compileall -q src tests main.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean PC-TeleRC.spec
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\PC-TeleRC.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PC-TeleRC.exe" | Set-Content -Encoding ascii dist\SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: PC-TeleRC-windows-x64-${{ github.sha }}
          path: |
            dist/PC-TeleRC.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/PC-TeleRC.exe
            dist/SHA256.txt
