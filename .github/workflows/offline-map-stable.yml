name: Stable v0.1.3 offline maps and LoRa
on:
  push:
    branches: [release/stable-v0.1.3]
permissions:
  contents: write
  actions: read
concurrency:
  group: stable-v0.1.3
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate application and offline maps
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q src tests main.py
          python -m pytest -q
          node --test tests/test_publish_stable.cjs
      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean PC-TeleRC.spec
          python scripts/verify_desktop_package.py
      - name: Verify frozen video, offline tiles, map controls and control isolation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath ".\dist\PC-TeleRC\PC-TeleRC.exe" -ArgumentList "--self-test-ui", "frozen-ui-check.json" -Wait -PassThru -RedirectStandardOutput frozen-stdout.txt -RedirectStandardError frozen-stderr.txt
          if (Test-Path frozen-ui-check.json) { Get-Content frozen-ui-check.json }
          if (Test-Path frozen-stderr.txt) { Get-Content frozen-stderr.txt }
          if ($p.ExitCode -ne 0) { throw "Frozen application check failed (exit $($p.ExitCode))" }
          $report = Get-Content frozen-ui-check.json -Raw | ConvertFrom-Json
          if (!$report.passed) { throw "Frozen offline map/media check did not pass" }
          Get-Content frozen-ui-check.json
      - name: Package portable, source and guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-dist | Out-Null
          Copy-Item START-HERE.md dist\PC-TeleRC\START-HERE.md
          foreach ($name in @('OFFLINE-MAPS','CAMERA-DESKTOP','KEYBOARD','LORA-USB-SETUP','THIRD-PARTY')) {
            Copy-Item "docs\$name.md" "dist\PC-TeleRC\$name.md"
          }
          @{ commit = '${{ github.sha }}'; run_id = '${{ github.run_id }}'; run_attempt = '${{ github.run_attempt }}' } | ConvertTo-Json | Set-Content -Encoding utf8 release-dist\build-provenance.json
          Copy-Item frozen-ui-check.json release-dist\frozen-ui-check.json
          Copy-Item docs\OFFLINE-MAPS.md release-dist\OFFLINE-MAPS.md
          Compress-Archive -Path dist\PC-TeleRC\* -DestinationPath release-dist\PC-TeleRC-portable-v0.1.3.zip
          git archive --format=zip --output=release-dist/PC-TeleRC-source-v0.1.3.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and checksums
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC-TeleRC.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-dist\PC-TeleRC-Setup-v0.1.3.exe release-dist\
          Get-ChildItem release-dist\* | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii release-dist\SHA256-windows.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          target_commitish: ${{ github.sha }}
          name: PC TeleRC v0.1.3 — Offline maps and LoRa
          draft: true
          prerelease: false
          make_latest: false
          body_path: docs/releases/v0.1.3.md
          files: release-dist/*
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate unchanged control firmware
        run: |
          git diff --exit-code 16b2d54a7ed08f42c42e04d3a1b04e4dc32e7495 HEAD -- firmware
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev
          python3 firmware/tests/run_tests.py
          python3 firmware/lora-tests/run_tests.py
          python3 firmware/lilygo-tests/run_host_tests.py
          python3 firmware/runtime-tests/run_tests.py
          python3 firmware/relay-tests/run_tests.py
      - name: Reuse verified targets only when every firmware source matches
        id: reuse
        uses: actions/github-script@v7
        env:
          RELEASE_TOKEN: ${{ github.token }}
        with:
          script: |
            core.setOutput('reused','false');
            const baseline='b6957f9175d1419411eda24df9d7de5e6875e5cd';
            const releases=await github.rest.repos.listReleases({...context.repo});
            const release=releases.data.find(r=>r.tag_name==='v0.1.3');
            if (!release || !release.draft) return;
            const assets=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id})).data;
            const names=['TeleRC-LoRa-915-PnP-v0.1.3-sketches.zip','TeleRC-LoRa-915-PnP-v0.1.3-targets.zip'];
            if (!names.every(name=>assets.some(a=>a.name===name && a.state==='uploaded' && a.digest))) return;
            const job=(await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}',{...context.repo,job_id:116320419322})).data;
            if (job.conclusion!=='success' || job.run_id!==38704340248) return;
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:job.run_id})).data;
            if (run.head_sha!==baseline) throw new Error('Firmware provenance commit changed');
            const cp=require('child_process');
            try { cp.execFileSync('git',['diff','--exit-code',baseline,context.sha,'--','firmware','stable_config/LoRa-915-PnP-v1']); }
            catch { core.info('Firmware sources differ; compile new targets'); return; }
            const fs=require('fs'),crypto=require('crypto');
            fs.mkdirSync('firmware-release',{recursive:true});
            const sums=[];
            for (const name of names) {
              const asset=assets.find(a=>a.name===name);
              const response=await fetch(asset.url,{headers:{Authorization:'Bearer '+process.env.RELEASE_TOKEN,Accept:'application/octet-stream'}});
              if (!response.ok) throw new Error('Verified firmware download failed');
              const bytes=Buffer.from(await response.arrayBuffer());
              const hash=crypto.createHash('sha256').update(bytes).digest('hex');
              if (bytes.length!==asset.size || 'sha256:'+hash!==asset.digest) throw new Error('Firmware checksum mismatch');
              fs.writeFileSync('firmware-release/'+name,bytes); sums.push(hash+'  '+name);
            }
            fs.writeFileSync('firmware-release/SHA256-firmware.txt',sums.join('\n')+'\n');
            fs.writeFileSync('firmware-release/FIRMWARE-PROVENANCE.txt','Exact preset targets built successfully by job 116320419322 from '+baseline+'. Reused only after every firmware/preset source matched and both archive SHA256 digests were verified.\n');
            core.setOutput('reused','true');
      - uses: arduino/setup-arduino-cli@v2
        if: steps.reuse.outputs.reused != 'true'
        with:
          version: 1.3.1
      - name: Install pinned preset build dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
      - name: Compile exact packaged 915 MHz BASE and ROVER presets
        if: steps.reuse.outputs.reused != 'true'
        run: |
          arduino-cli compile --fqbn esp32:esp32:lilygo_t3s3:CDCOnBoot=cdc,Revision=Radio_SX1262,PSRAM=enabled --output-dir firmware-build/BASE stable_config/LoRa-915-PnP-v1/firmware/TeleRCLoRa_BASE
          arduino-cli compile --fqbn esp32:esp32:lilygo_t3s3:CDCOnBoot=cdc,Revision=Radio_SX1262,PSRAM=enabled --output-dir firmware-build/ROVER stable_config/LoRa-915-PnP-v1/firmware/TeleRCLoRa_ROVER
      - name: Package preset source and target builds
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p firmware-release
          cd stable_config/LoRa-915-PnP-v1
          zip -r ../../firmware-release/TeleRC-LoRa-915-PnP-v0.1.3-sketches.zip .
          cd ../..
          cp stable_config/LoRa-915-PnP-v1/READ-ME-FIRST.md firmware-build/READ-ME-FIRST.md
          cd firmware-build
          zip -r ../firmware-release/TeleRC-LoRa-915-PnP-v0.1.3-targets.zip .
          cd ../firmware-release
          sha256sum *.zip > SHA256-firmware.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          files: firmware-release/*
  publish:
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloads and publish stable Latest
        uses: actions/github-script@v7
        env:
          RELEASE_TOKEN: ${{ github.token }}
        with:
          script: |
            const publishStable = require('./scripts/publish_stable.cjs');
            await publishStable({github, context: {...context, runAttempt: process.env.GITHUB_RUN_ATTEMPT}, core,
              token: process.env.RELEASE_TOKEN});
