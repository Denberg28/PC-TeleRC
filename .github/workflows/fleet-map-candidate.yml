name: Map-only fleet station candidate
on:
  push:
    branches: [release/fleet-map-v1.2.0rc1]
permissions:
  contents: read
concurrency:
  group: fleet-map-v1.2.0rc1
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: arduino/setup-arduino-cli@v2
        with: {version: '1.3.1'}
      - name: Verify guard sanitizers, multiple real encrypted endpoints and relay compatibility
        run: |
          python -m pip install -r firmware/fleet/requirements.txt pytest==9.1.1
          python -m compileall -q firmware/fleet scripts src
          python firmware/fleet/tools/assemble_examples.py
          git diff --exit-code -- firmware/fleet/sketches
          git diff --exit-code 413ac34a1bcafcdb4adb3edbfe514a74ba5657a5 -- firmware/scalable firmware/unified firmware/mission firmware/TeleRC_4x_BTS7960_PWM_GlitchFilter
          python -m pytest --noconftest firmware/fleet/tests -q
          python firmware/fleet/tests/run_native.py
          python -m unittest discover -s scripts -p 'test_*safety.py' -v
      - name: Install pinned board dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
      - name: Compile fleet roles and unchanged converter; sanitize public archive
        run: python scripts/build_fleet_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-current-firmware
          path: |
            fleet-dist/*.zip
            fleet-dist/*.json
  windows:
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/download-artifact@v4
        with:
          name: Fleet-current-firmware
          path: fleet-dist
      - name: Build and check Windows map-only executable, fleet regressions and frozen map
        run: python scripts/build_windows_mission.py --source-commit '${{ github.sha }}'
      - name: Build installer and retain evidence
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler 'installer\PC-TeleRC.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-dist\PC-TeleRC-Setup-v1.2.0rc1.exe release-dist\
          Copy-Item frozen-ui-check.json,windows-tests.xml,frozen-stdout.txt,frozen-stderr.txt release-dist\
          Copy-Item fleet-dist\TeleRC-Fleet-LoRa-v0.5.0rc1.zip release-dist\
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-current-Windows
          path: release-dist/
  publish:
    needs: [firmware, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fleet-current-Windows
          path: incoming
      - name: Validate Windows and matching firmware, download-verify all assets and publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_fleet.py
