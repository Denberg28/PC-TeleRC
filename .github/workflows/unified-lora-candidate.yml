name: Unified LoRa manual and mission candidate
on:
  push:
    branches: [dev/unified-lora-v0.3.0]
permissions:
  contents: read
concurrency:
  group: unified-lora-v0.3.0
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: arduino/setup-arduino-cli@v2
        with: {version: '1.3.1'}
      - name: Validate actual gates, crypto, transitions and current PC serial interfaces
        run: |
          python -m pip install -r firmware/unified/requirements.txt pytest==9.1.1
          python firmware/unified/tools/assemble_examples.py
          git diff --exit-code -- firmware/unified/sketches
          python -m pytest --noconftest firmware/unified/tests/test_pc_compatibility.py -q
          python firmware/unified/tests/run_native.py --sanitize
      - name: Install pinned ESP32 and radio dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
      - name: Compile public and private test roles; distribute keyless images only
        run: python firmware/unified/tools/build_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeleRC-Unified-LoRa-0.3.0rc1
          path: unified-dist/*.*
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TeleRC-Unified-LoRa-0.3.0rc1
          path: unified-dist
      - name: Verify downloads and publish the development candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python firmware/unified/tools/publish.py
