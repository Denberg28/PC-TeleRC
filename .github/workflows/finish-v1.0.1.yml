name: Verify and publish the saved v1.0.1 artifacts
on:
  push:
    branches: [release/finish-v1.0.1]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify corrected publisher without UI or radio side effects
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest --noconftest tests/test_stable_v101_release.py -q
      - uses: actions/download-artifact@v4
        with:
          name: PC-TeleRC-v1.0.1-final-assets
          path: stable-release
          run-id: 40030076545
          github-token: ${{ github.token }}
      - name: Verify saved build, uploaded and downloaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_v1_release.py --existing stable-release --commit 8e379b25da6dc07ccf8ba2c3439a73fce3245256 --publish --resume-draft
