name: Windows scalable firmware support candidate
on:
  push:
    branches: [release/firmware-support-v1.1.0rc1]
permissions:
  contents: read
concurrency:
  group: firmware-support-v1.1.0rc1
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Check release source boundaries
        run: python -m unittest discover -s scripts -p 'test_*safety.py' -v
      - name: Build and verify native Windows application
        run: python scripts/build_windows_mission.py --source-commit '${{ github.sha }}'
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler 'installer\PC-TeleRC.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-dist\PC-TeleRC-Setup-v1.1.0rc1.exe release-dist\
          Copy-Item frozen-ui-check.json,windows-tests.xml,frozen-stdout.txt,frozen-stderr.txt release-dist\
      - uses: actions/upload-artifact@v4
        with:
          name: PC-TeleRC-v1.1.0rc1-Windows
          path: release-dist/
  native-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check current PC drivers against actual scalable BASE runtime
        run: |
          python -m pip install -r firmware/scalable/requirements.txt pytest==9.1.1
          python -m pytest --noconftest firmware/scalable/tests -q
          python firmware/scalable/tests/run_native.py --sanitize
          git diff --exit-code 07ddf07b5d465619123e69977d737b6420f56801 -- firmware
      - name: Verify exact published firmware archive and eleven target-build records
        run: python -c "import sys;sys.path.insert(0,'scripts');from firmware_baseline import obtain;obtain('firmware-baseline-dist')"
  publish:
    needs: [windows, native-protocol]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PC-TeleRC-v1.1.0rc1-Windows
          path: incoming
      - name: Sanitize packages, verify downloaded assets and publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_firmware_support.py
