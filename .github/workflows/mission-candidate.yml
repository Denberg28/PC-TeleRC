name: PC TeleRC v0.1.5rc3 LoRa mission planning
on:
  push:
    branches: [dev/mission-planning-v0.1.5rc1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telerc-migration-v0.1.5rc3
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Protect existing manual firmware and profiles
        shell: pwsh
        run: |
          git diff --exit-code 0edd09475dd4668a8793caf1402b15d3f35d0a1b HEAD -- firmware stable_config ':(exclude)firmware/mission'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and build Windows portable with public matching sketches
        run: python scripts/build_windows_mission.py --source-commit '${{ github.sha }}'
      - name: Verify publish tooling
        run: node --test tests/test_publish_stable.cjs
      - name: Preserve portable candidate and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC-TeleRC-v0.1.5rc3-portable-and-evidence
          path: |
            release-dist/*
            frozen-ui-check.json
            frozen-stdout.txt
            frozen-stderr.txt
          if-no-files-found: warn
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler 'installer\PC-TeleRC.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-dist\PC-TeleRC-Setup-v0.1.5rc3.exe release-dist\
          Get-ChildItem release-dist -File | Where-Object Name -ne 'SHA256-windows.txt' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii release-dist\SHA256-windows.txt
      - name: Preserve complete Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: PC-TeleRC-v0.1.5rc3-Windows
          path: release-dist/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5rc3
          target_commitish: ${{ github.sha }}
          name: PC TeleRC v0.1.5rc3 — LoRa mission planning
          draft: true
          prerelease: true
          make_latest: false
          body_path: docs/releases/v0.1.5rc3.md
          files: release-dist/*
          fail_on_unmatched_files: true
