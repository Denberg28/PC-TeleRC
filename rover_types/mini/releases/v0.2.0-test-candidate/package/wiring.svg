<path d="M185,240L185,315" stroke="#bc632b" stroke-width="4" fill="none"/>
<rect x="45" y="665" width="550" height="205" rx="12" fill="#fff" stroke="#bbcddd" stroke-width="2"/>
<text x="63" y="697" class="h">D1 MX1508 — LEFT</text>
<text x="63" y="727" class="t">IN1 / IN2 &lt;- GPIO4 / GPIO5</text>
<text x="63" y="754" class="t">IN3 / IN4 &lt;- GPIO6 / GPIO7</text>
<text x="63" y="781" class="t">Motor A outputs -&gt; left-front motor</text>
<text x="63" y="808" class="t">Motor B outputs -&gt; left-rear motor</text>
<text x="63" y="835" class="t">Power input &lt;- motor buck 5 V</text>
<rect x="900" y="665" width="550" height="205" rx="12" fill="#fff" stroke="#bbcddd" stroke-width="2"/>
<text x="918" y="697" class="h">D2 MX1508 — RIGHT</text>
<text x="918" y="727" class="t">IN1 / IN2 &lt;- GPIO8 / GPIO9</text>
<text x="918" y="754" class="t">IN3 / IN4 &lt;- GPIO10 / GPIO11</text>
<text x="918" y="781" class="t">Motor A outputs -&gt; right-front motor</text>
<text x="918" y="808" class="t">Motor B outputs -&gt; right-rear motor</text>
<text x="918" y="835" class="t">Power input &lt;- motor buck 5 V</text>
<path d="M1140,595L1140,625" stroke="#24659a" stroke-width="3" fill="none"/>
<path d="M1140,625L320,625" stroke="#24659a" stroke-width="3" fill="none"/>
<path d="M320,625L320,665" stroke="#24659a" stroke-width="3" fill="none"/>
<path d="M1290,595L1290,665" stroke="#24659a" stroke-width="3" fill="none"/>
<path d="M1450,180L1475,180" stroke="#bc632b" stroke-width="4" fill="none"/>
<path d="M1475,180L1475,625" stroke="#bc632b" stroke-width="4" fill="none"/>
<path d="M1475,625L1450,625" stroke="#bc632b" stroke-width="4" fill="none"/>
<path d="M1450,625L1450,680" stroke="#bc632b" stroke-width="4" fill="none"/>
<text x="615" y="707" class="h">CH6 selector</text>
<text x="615" y="743" class="t">~1000 us = TX</text>
<text x="615" y="772" class="t">~1500 us = STOP</text>
<text x="615" y="801" class="t">~2000 us = PC</text>
<text x="615" y="841" class="s">CH5 low = OFF</text>
<rect x="45" y="930" width="1405" height="100" rx="12" fill="#e3ebf2" stroke="#bbcddd" stroke-width="2"/>
<text x="63" y="962" class="h">COMMON GND — separate return wires to star point</text>
<text x="63" y="992" class="t">Battery/bucks, ESP32, receiver, buffer and both drivers share GND. Motor return current bypasses ESP32 headers.</text>
<path d="M180,870L180,930" stroke="#586c7d" stroke-width="3" fill="none"/>
<path d="M1200,870L1200,930" stroke="#586c7d" stroke-width="3" fill="none"/>
<text x="45" y="1071" class="h">Receiver failsafe: CH1/CH2 CENTER, CH5 OFF, CH6 STOP. Test with transmitter switched OFF.</text>
<text x="45" y="1106" class="t">8x motor-input pulldowns (10 kohm). Buffer details and receiver-input pulldowns: see WIRING.md.</text>
<text x="45" y="1137" class="t">100 nF across each motor; bulk + ceramic capacitors at drivers and logic power. Stops coast, not holding brake.</text>
<text x="45" y="1168" class="s">PC mode still requires healthy FS-iA6 + radio permission. Wi-Fi failure does not interrupt healthy TX control.</text>
<path d="M1475,610 L70,610 L70,665" stroke="#bc632b" stroke-width="4" fill="none"/></svg>