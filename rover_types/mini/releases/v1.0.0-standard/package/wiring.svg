<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52687c"/></marker></defs><rect width="1400" height="1040" fill="#f3f6fa"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#163047} .title{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.small{font-size:15px} .wire{stroke:#52687c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="40" y="48" class="title">MINI ROVER 1.0.0 — DEFAULT MX1508 / FOUR TT MOTORS</text><text x="40" y="78" class="body">ESP32-S3 DevKitC-1 • FS-iA6 PWM • PC TeleRC Wi-Fi • Wiring overview only</text><rect x="40" y="110" width="300" height="130" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="58" y="140" class="head">2S battery</text><text x="58" y="170" class="body">8.4 V fully charged</text><text x="58" y="197" class="body">Fuse and rated wiring</text><text x="58" y="224" class="body">Never raw 2S to ESP32/TT</text><rect x="440" y="110" width="405" height="130" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="458" y="140" class="head">Logic buck → regulated 5 V</text><text x="458" y="170" class="body">ESP32 5V + FS-iA6 VCC</text><text x="458" y="197" class="body">Separate positive from motor buck</text><text x="458" y="224" class="body">External 5 V disconnected for USB</text><rect x="945" y="110" width="415" height="130" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="963" y="140" class="head">Motor buck → regulated 5 V</text><text x="963" y="170" class="body">Motor fuse + isolation switch</text><text x="963" y="197" class="body">Then D1 and D2 V+</text><text x="963" y="224" class="body">Size for simultaneous startup</text><path class="wire" d="M340,145 L440,145"/><path class="wire" d="M340,220 L395,220"/><path class="wire" d="M395,220 L395,270"/><path class="wire" d="M395,270 L920,270"/><path class="wire" d="M920,270 L920,175"/><path class="wire" d="M920,175 L945,175"/><rect x="40" y="330" width="380" height="440" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="58" y="360" class="head">FS-iA6 → 3.3 V logic</text><text x="58" y="390" class="body">Receiver VCC = logic buck 5 V</text><text x="58" y="417" class="body">GND = common reference</text><text x="58" y="444" class="body">CH1 = steering, center 1500 µs</text><text x="58" y="471" class="body">CH2 = drive, center 1500 µs</text><text x="58" y="498" class="body">CH5 = ARM OFF / ON</text><text x="58" y="525" class="body">CH6 = TX / STOP / PC</text><text x="58" y="552" class="body"></text><text x="58" y="579" class="body">Unknown / 5 V HIGH:</text><text x="58" y="606" class="body">SN74LVC125A at 3.3 V</text><text x="58" y="633" class="body">Four signal inputs → outputs</text><text x="58" y="660" class="body">10k pull-down on each input</text><text x="58" y="687" class="body">See WIRING.md for exact pins</text><rect x="590" y="330" width="300" height="440" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="608" y="360" class="head">ESP32-S3</text><text x="608" y="390" class="body">GPIO12 ← CH1</text><text x="608" y="417" class="body">GPIO13 ← CH2</text><text x="608" y="444" class="body">GPIO14 ← CH5</text><text x="608" y="471" class="body">GPIO15 ← CH6</text><text x="608" y="498" class="body"></text><text x="608" y="525" class="body">GPIO4 / 5 → LF</text><text x="608" y="552" class="body">GPIO6 / 7 → LR</text><text x="608" y="579" class="body">GPIO8 / 9 → RF</text><text x="608" y="606" class="body">GPIO10 / 11 → RR</text><text x="608" y="633" class="body"></text><text x="608" y="660" class="body">GPIO21 → 330Ω → LED</text><text x="608" y="687" class="body">BOOT = software stop</text><path class="wire" d="M420,390 L590,390"/><text x="470" y="382" class="small">CH1</text><path class="wire" d="M420,417 L590,417"/><text x="470" y="409" class="small">CH2</text><path class="wire" d="M420,444 L590,444"/><text x="470" y="436" class="small">CH5</text><path class="wire" d="M420,471 L590,471"/><text x="470" y="463" class="small">CH6</text><rect x="1070" y="330" width="290" height="205" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="1088" y="360" class="head">D1 — MX1508</text><text x="1088" y="390" class="body">IN1/2 ← GPIO4/5</text><text x="1088" y="417" class="body">OUT pair → left front</text><text x="1088" y="444" class="body">IN3/4 ← GPIO6/7</text><text x="1088" y="471" class="body">OUT pair → left rear</text><text x="1088" y="498" class="body">V+ 5 V; GND common</text><rect x="1070" y="565" width="290" height="205" rx="12" fill="#ffffff" stroke="#c0ccd8"/><text x="1088" y="595" class="head">D2 — MX1508</text><text x="1088" y="625" class="body">IN1/2 ← GPIO8/9</text><text x="1088" y="652" class="body">OUT pair → right front</text><text x="1088" y="679" class="body">IN3/4 ← GPIO10/11</text><text x="1088" y="706" class="body">OUT pair → right rear</text><text x="1088" y="733" class="body">V+ 5 V; GND common</text><path class="wire" d="M890,525 L970,525"/><path class="wire" d="M970,525 L970,410"/><path class="wire" d="M970,410 L1070,410"/><path class="wire" d="M890,579 L1010,579"/><path class="wire" d="M1010,579 L1010,645"/><path class="wire" d="M1010,645 L1070,645"/><text x="902" y="800" class="small">10k pull-down on every driver IN</text><rect x="40" y="830" width="1320" height="165" rx="12" fill="#e5eef6" stroke="#c0ccd8"/><text x="58" y="860" class="head">Common GND • separate motor returns • one full bridge per motor</text><text x="58" y="890" class="body">100 nF at each motor; bulk + ceramic caps at drivers; keep PWM/antenna away from motor wiring.</text><text x="58" y="917" class="body">Set receiver failsafe: CH1/CH2 center, CH5 OFF, CH6 STOP. Verify TX-off and TX-return physically.</text><text x="58" y="944" class="body">Two-motor build: use LF and RF slots only. Other drivers: use the exact profile table in WIRING.md.</text><text x="58" y="971" class="body">This is a source standard; current, temperature, signal levels and stopping distance need bench acceptance.</text></svg>